# Hardware inventory for the tank controller in valve-controller.s32.
#
# This file only declares hardware existence, register types, ranges, and reset
# values. It does not contain the pressure target, ten-second hold requirement,
# valve sequence, transitions, or actions. Those decisions are all in assembly.

schema: sentinel.hardware/v0
id: tank_hardware
publication: 1

# Both physical valves use the same electrical command encoding.
types:
  valve_state:
    variants: [closed, open]

# Read-only instruments attached to the tank.
telemetry:
  tank_pressure:
    # Integer milli-pressure units: 50000 means 50.000 pressure units.
    type: i32
    unit: pressure_milli
    range: {min: 0, max: 100000}
    initial: 0
  seconds_since_inlet_closed:
    # Whole simulated seconds measured since the inlet was last closed.
    type: i32
    unit: count
    range: {min: 0, max: 1000000}
    initial: 0

# Write-only request registers. The controller independently commands the
# inlet and outlet valves.
actuators:
  inlet_valve:
    type: valve_state
    unit: none
    initial: closed
  outlet_valve:
    type: valve_state
    unit: none
    initial: closed

# Read-only physical valve-position switches.
feedback:
  inlet_valve_position:
    type: valve_state
    unit: none
    initial: closed
  outlet_valve_position:
    type: valve_state
    unit: none
    initial: closed
