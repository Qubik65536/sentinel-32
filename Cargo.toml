[workspace]
members = [
    "crates/sentinel-ai-check",
    "crates/sentinel-app",
    "crates/sentinel-core",
    "crates/sentinel-safety",
    "crates/sentinel-scenario",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
